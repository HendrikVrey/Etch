name: Release

# Tag-driven. Pushing v1.2.3 publishes both architectures, builds one installer
# carrying them, and attaches it to a GitHub release.
#
# There is no signing certificate, so Etch-Setup.exe is unsigned and SmartScreen
# will warn about it. That is stated plainly in the README rather than left for a
# user to discover; adding a certificate here later means one extra step between
# iscc and the upload.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v"
        required: true

permissions:
  contents: write

jobs:
  release:
    # Windows, and not negotiable: Etch targets net10.0-windows with UseWPF, which
    # does not build anywhere else.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Work out the version
        id: version
        shell: pwsh
        # The input arrives through the environment rather than being substituted into
        # the script text, where a value containing a quote would end the literal and
        # run whatever followed.
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $env:GITHUB_REF -replace '^refs/tags/v', ''
          } else {
            $env:INPUT_VERSION
          }
          if (-not $version) { throw 'No version could be determined.' }

          # Inno Setup's VersionInfoVersion must be strictly numeric, and the v* tag
          # glob admits v1.2.3-rc1. Strip the suffix for that one directive only.
          $numeric = ($version -split '[-+]')[0]
          if ($numeric -notmatch '^\d+(\.\d+){1,3}$') {
            throw "Cannot derive a numeric version from '$version'."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "numeric=$numeric" >> $env:GITHUB_OUTPUT

      - name: Build and test
        run: |
          dotnet build Etch.slnx -c Release
          dotnet test Etch.slnx -c Release --no-build

      # Self-contained, single-file, ReadyToRun. Compression and trimming are off,
      # each for a reason written down in Etch.App.csproj - compression costs
      # startup time on every launch, and WPF resolves types by reflection.
      - name: Publish win-x64
        run: >
          dotnet publish src/Etch.App/Etch.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:PublishReadyToRun=true
          -p:Version=${{ steps.version.outputs.version }}
          -o publish/win-x64

      # Cross-publishing R2R for arm64 from an x64 runner is supported: the SDK
      # runs crossgen2 for the target RID.
      - name: Publish win-arm64
        run: >
          dotnet publish src/Etch.App/Etch.App.csproj
          -c Release -r win-arm64 --self-contained true
          -p:PublishSingleFile=true -p:PublishReadyToRun=true
          -p:Version=${{ steps.version.outputs.version }}
          -o publish/win-arm64

      # windows-latest currently ships Inno Setup already (it is in the 2025 image's
      # toolset). This pins its presence rather than depending on that staying true,
      # which is cheap insurance against a runner-image change breaking a release.
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build the installer
        run: >
          iscc installer\Etch.iss
          /DAppVersion=${{ steps.version.outputs.version }}
          /DNumericVersion=${{ steps.version.outputs.numeric }}

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          # Explicit, because the action defaults tag_name to github.ref - which on the
          # workflow_dispatch path is a branch, and would publish a release against a
          # tag named after the branch while the title claimed a version number.
          tag_name: v${{ steps.version.outputs.version }}
          name: Etch ${{ steps.version.outputs.version }}
          draft: true
          files: dist/Etch-Setup.exe
